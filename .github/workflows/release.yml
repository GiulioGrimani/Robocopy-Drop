name: Build and publish release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versione X.Y.Z per una build di prova"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

    steps:
      - name: Check WiX terms acknowledgement
        shell: pwsh
        run: |
          if ("${{ vars.WIX_OSMF_ACCEPTED }}" -ne "true") {
            throw "Set the repository variable WIX_OSMF_ACCEPTED=true only after reviewing docs/NOTICE-WIX.txt and the current WiX/OSMF terms."
          }

      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = "${{ inputs.version }}".TrimStart("v")
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid version: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore signing certificate
        id: signing
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            "enabled=false" >> $env:GITHUB_OUTPUT
            "thumbprint=" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $path = "$env:RUNNER_TEMP\RobocopyDrop-signing.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX_BASE64))
          $flags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($path, $env:PFX_PASSWORD, $flags)
          "enabled=true" >> $env:GITHUB_OUTPUT
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Configure GitHub update feed
        shell: pwsh
        run: |
          $parts = "${{ github.repository }}".Split("/", 2)
          $signed = "${{ steps.signing.outputs.enabled }}" -eq "true"
          $pins = if ($signed) { @("${{ steps.signing.outputs.thumbprint }}") } else { @() }
          $config = [ordered]@{
            owner = $parts[0]
            repository = $parts[1]
            apiVersion = "2026-03-10"
            requireSignedUpdates = $signed
            allowedSignerThumbprints = $pins
          }
          $config | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath github-release.json -Encoding UTF8

      - name: Build MSI packages
        shell: pwsh
        env:
          ROBOCOPYDROP_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $arguments = @{
            Version = "${{ steps.version.outputs.version }}"
            AcceptWixTerms = $true
            NonInteractive = $true
          }
          if ("${{ steps.signing.outputs.enabled }}" -eq "true") {
            $arguments.PfxPath = "$env:RUNNER_TEMP\RobocopyDrop-signing.pfx"
          }
          & .\tools\Build-Release.ps1 @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Build failed with exit code $LASTEXITCODE"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Robocopy-Drop-${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: error

      - name: Create GitHub release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = @(Get-ChildItem -LiteralPath release -File | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) {
            throw "No release assets were produced."
          }
          & gh release create $tag @assets --title "Robocopy Drop ${{ steps.version.outputs.version }}" --generate-notes
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release creation failed with exit code $LASTEXITCODE"
          }
